# -------------------------------------------------
# Site
# -------------------------------------------------
title: "Karri Manikantta Reddy"
subtitle: "MTS Software Development Engineer"
description: "Portfolio, projects, and contact details."
url: "https://manikantta-reddy.github.io"
baseurl: ""

repository: "manikantta-reddy/manikantta-reddy.github.io"

# -------------------------------------------------
# Theme (Modern)
# Minimal Mistakes is GitHub Pages compatible via remote_theme
# -------------------------------------------------
remote_theme: "mmistakes/minimal-mistakes@4.27.3"
minimal_mistakes_skin: "dark"   # modern look; try: air / contrast / dark / neon / mint

# -------------------------------------------------
# Author profile (shows nicely in sidebar/header)
# -------------------------------------------------
author:
  name: "Karri Manikantta Reddy"
  avatar: "/assets/img/profile.jpg"    # add this image (optional but recommended)
  bio: "Software engineer focused on building scalable systems, clean APIs, and reliable services."
  location: "Hyderabad, India"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/manikantta-reddy"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/<your-linkedin>"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:your.email@example.com"

# -------------------------------------------------
# Features
# -------------------------------------------------
search: true
breadcrumbs: true
read_time: true

# -------------------------------------------------
# Plugins
# Minimal Mistakes requires jekyll-include-cache
# -------------------------------------------------
plugins:
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
permalink: pretty
timezone: Asia/Kolkata
locale: en-IN

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
